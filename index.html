<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Daily Papers — 허깅페이스 논문 요약 아카이브</title>
  <meta name="description" content="허깅페이스 Daily Papers의 핵심 논문을 매일 한글로 요약하고 인포그래픽으로 정리한 아카이브" />
  <!-- 테마 깜빡임 방지: CSS 적용 전에 테마 결정 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=20260617" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./">
        <span class="logo">AI</span>
        <span>AI Daily Papers<small>허깅페이스 논문 요약 아카이브</small></span>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="라이트/다크 모드 전환" aria-label="테마 전환">🌙</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>오늘의 AI 연구를 <span class="grad">한 장으로</span>.</h1>
      <p>
        허깅페이스 <strong>Daily Papers</strong>에서 주목할 만한 논문을 매일 선별해 한글로 요약하고,
        한 장짜리 인포그래픽으로 정리합니다.
      </p>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <div class="controls">
    <div class="wrap">
      <div class="ctl-top">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
          <input id="search" type="search" placeholder="제목 · 소속 · 키워드 검색" />
        </label>
        <select class="sort" id="sort" aria-label="정렬">
          <option value="date">최신순</option>
          <option value="upvotes">인기순(upvote)</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">날짜</span>
        <div class="chips datechips" id="dateChips"></div>
      </div>
    </div>
  </div>

  <main>
    <div class="wrap">
      <div id="app">
        <div class="empty">불러오는 중…</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      데이터 출처: <a href="https://huggingface.co/papers" target="_blank" rel="noopener">Hugging Face Daily Papers</a> ·
      원문: <a href="https://arxiv.org" target="_blank" rel="noopener">arXiv</a><br />
      매일 자동 생성되는 AI 논문 요약 아카이브
    </div>
  </footer>

  <script src="assets/js/main.js?v=20260617"></script>
</body>
</html>
